
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NCA 2026 | Abstract Book Flipbook</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#10264b;color:white;
 font-family:Arial,sans-serif;text-align:center
}
header{padding:20px 10px}
h1{font-size:clamp(19px,3vw,28px);margin:0 0 10px}
header p{margin:0;color:#f2d17c}
#status{padding:12px;font-size:14px}
.stage{
 display:flex;justify-content:center;
 align-items:center;min-height:68vh;
 padding:15px;overflow:hidden
}
#book{margin:auto}
.page{
 background:white;color:#333;
 overflow:hidden
}
.page canvas{
 width:100%;height:100%;
 display:block;object-fit:contain
}
.cover{
 background:#fff;
 display:flex;align-items:center;
 justify-content:center
}
.controls{
 display:flex;flex-wrap:wrap;
 justify-content:center;align-items:center;
 gap:10px;padding:15px
}
button,.download{
 background:#f2d17c;color:#10264b;
 border:0;border-radius:8px;
 padding:12px 18px;font-weight:bold;
 cursor:pointer;text-decoration:none
}
button:disabled{opacity:.45;cursor:default}
#counter{min-width:105px}
footer{padding:12px;font-size:12px;color:#ddd}
</style>
</head>
<body>
<header>
<h1>NATIONAL CONFERENCE ON AGEING 2026</h1>
<p>ABSTRACT BOOK | 19–21 OCTOBER 2026</p>
</header>

<div id="status">Loading flipbook...</div>
<div class="stage">
 <div id="book"></div>
</div>

<div class="controls">
 <button id="prev">❮ Previous</button>
 <span id="counter">Loading...</span>
 <button id="next">Next ❯</button>
 <a class="download"
 href="ABSTRACT%20BOOK%20B.pdf" download>
 Download PDF
 </a>
</div>

<footer>
NCA 2026 | MyAgeing® | Universiti Putra Malaysia
</footer>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script type="module">
import * as pdfjsLib from
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

const status=document.getElementById("status");
const counter=document.getElementById("counter");
const prev=document.getElementById("prev");
const next=document.getElementById("next");
const book=document.getElementById("book");

try{
 if(!window.St || !window.St.PageFlip){
  throw new Error("Page-flip library unavailable");
 }

 const pdf=await pdfjsLib.getDocument(
  "ABSTRACT%20BOOK%20B.pdf"
 ).promise;

 const first=await pdf.getPage(1);
 const base=first.getViewport({scale:1});
 const width=550;
 const height=Math.round(width*base.height/base.width);

 const elements=[];
 for(let i=1;i<=pdf.numPages;i++){
  const div=document.createElement("div");
  div.className="page";
  div.dataset.page=i;
  if(i===1)div.dataset.density="hard";
  book.appendChild(div);
  elements.push(div);
 }

 const flip=new St.PageFlip(book,{
  width:width,
  height:height,
  size:"stretch",
  minWidth:220,
  maxWidth:width,
  minHeight:Math.round(height*.4),
  maxHeight:height,
  showCover:true,
  usePortrait:true,
  mobileScrollSupport:false,
  maxShadowOpacity:.45,
  flippingTime:850,
  drawShadow:true,
  autoSize:true
 });

 flip.loadFromHTML(elements);

 const loaded=new Set();
 const loading=new Set();

 async function renderPage(num){
  if(num<1||num>pdf.numPages||
     loaded.has(num)||loading.has(num))return;
  loading.add(num);
  try{
   const page=await pdf.getPage(num);
   const viewport=page.getViewport({scale:1.3});
   const canvas=document.createElement("canvas");
   canvas.width=Math.round(viewport.width);
   canvas.height=Math.round(viewport.height);
   await page.render({
    canvasContext:canvas.getContext("2d"),
    viewport:viewport
   }).promise;
   elements[num-1].replaceChildren(canvas);
   loaded.add(num);
  }catch(e){
   console.error("Page "+num,e);
  }finally{
   loading.delete(num);
  }
 }

 function preload(index){
  const jobs=[];
  for(let i=Math.max(1,index-1);
      i<=Math.min(pdf.numPages,index+5);i++){
   jobs.push(renderPage(i));
  }
  return Promise.all(jobs);
 }

 function update(){
  const current=flip.getCurrentPageIndex();
  counter.textContent=
   (current+1)+" / "+pdf.numPages;
  prev.disabled=current===0;
  next.disabled=current>=pdf.numPages-1;
  preload(current+1);
 }

 await preload(1);
 flip.on("flip",update);
 flip.on("changeState",()=>{
  preload(flip.getCurrentPageIndex()+1);
 });

 prev.onclick=()=>flip.flipPrev();
 next.onclick=()=>flip.flipNext();

 update();
 status.textContent="Flip pages by clicking the corners";
}catch(e){
 console.error(e);
 status.textContent=
 "Unable to load flipbook. Please use Download PDF.";
 counter.textContent="Unavailable";
}
</script>
</body>
</html>
